name: CI

on:
  pull_request:
    branches: [main, adoption-is]
  push:
    branches: [main, adoption-is]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build application and run unit tests
        run: npm run check

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify API-backed desktop and mobile journeys
        run: npm run test:e2e -- --reporter=list,html
      - name: Build public demo
        run: npm run build:public
      - name: Verify public desktop and mobile release checks
        run: >-
          npx playwright test --config playwright.public.config.ts
          tests/public-browser/deployment.spec.ts
          tests/public-browser/home-photos.spec.ts
          tests/public-browser/home-why.spec.ts
          tests/public-browser/girl-hover.spec.ts
          --reporter=list,html
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
